name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v1.0.0 (created on the selected branch if it does not exist yet)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # Manual run: GITHUB_REF_NAME is the branch, so use the supplied tag.
            # gh creates the tag at the checked-out commit if it does not exist.
            gh release create "$INPUT_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$INPUT_TAG" \
              --target "$GITHUB_SHA" \
              --generate-notes
          else
            # Tag push: release the tag that triggered the run.
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi
