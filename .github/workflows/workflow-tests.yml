name: Workflow Tests

on:
  pull_request:
    branches:
      - "main"
    paths:
      - "agents/**"
      - "commands/**"
      - "skills/**"
      - "workflows/**"
      - "tests/**"
      - "build.sh"
      - "install.sh"
      - "uninstall.sh"
      - "plugin/**"
      - "packaging/**"
      - ".claude-plugin/**"
      - "LICENSE"
      - "scripts/**"
      - "docs/reference.json"
      - ".github/workflows/workflow-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Check packaging script syntax
        run: for script in build.sh install.sh uninstall.sh scripts/test-*.sh; do bash -n "$script"; done
      - name: Check local builds and legacy removal
        run: |
          bash scripts/test-build.sh
          bash scripts/test-uninstall.sh
          bash scripts/test-install.sh
          bash scripts/test-codex-install.sh
      - name: Check what the Claude plugin adds to every session
        run: bash scripts/test-session-footprint.sh
      - name: Run the oss-security-case routing test (mocked agents)
        run: node tests/workflows/oss-security-case.test.mjs
      - name: Check current and legacy project rule lookup
        run: bash scripts/test-rules-migration.sh
      - name: Check the Claude workflow bundle
        run: bash scripts/test-claude-workflow-install.sh
      - name: Test the helper scripts (stand-in gh)
        run: bash scripts/test-helper-scripts.sh
      - name: Test the docs site generator
        run: bash scripts/test-build-docs.sh
      - name: Check committed Claude plugin output
        run: |
          bash build.sh claude
          git diff --exit-code -- plugin/
          test -z "$(git ls-files --others --exclude-standard -- plugin/)"
